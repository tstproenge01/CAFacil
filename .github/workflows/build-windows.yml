name: Build CertiFacil for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter playwright pyinstaller pyinstaller-hooks-contrib
      - name: Build portable executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --collect-all customtkinter --collect-all playwright
          --collect-all greenlet --collect-all pyee
          --name CertiFacil app.py
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/CertiFacil.exe")) { throw "Executável não foi criado." }
          $size = (Get-Item "dist/CertiFacil.exe").Length
          if ($size -lt 10000000) { throw "Executável inesperadamente pequeno: $size bytes" }
          Write-Host "Executável criado: $size bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: CertiFacil-Windows-x64
          path: dist/CertiFacil.exe
          if-no-files-found: error
          retention-days: 30
